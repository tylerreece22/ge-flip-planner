name: Refresh prices

# Rebuilds site/data.json from the OSRS Wiki prices API every hour and,
# once publishing is switched on, deploys the site to GitHub Pages.
# GitHub often starts scheduled runs late and sometimes skips one, so the page
# does not depend on this: it fetches any hours the file is missing by itself.
on:
  schedule:
    - cron: "12 * * * *"   # 12 minutes past every hour, once the last hour's prices are published
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull price history
        run: python3 scripts/scrape.py
      - name: Check the planner runs on the new data
        run: |
          node scripts/check.js
          node scripts/preview.js 36m 5 8
      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows in public repos after 60 days without
        # repository activity. Re-enabling the workflow resets that clock.
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Set the repository variable PUBLISH_PAGES to "true" to put the site online.
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
